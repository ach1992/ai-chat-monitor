name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      VALIDATION_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.VALIDATION_SHA }}
      - name: Verify exact validation SHA
        run: test "$(git rev-parse HEAD)" = "$VALIDATION_SHA"
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npm run validate
      - run: npm run smoke:extension
      - run: npm run package
      - name: Verify release ZIP
        run: |
          unzip -t artifacts/ai-chat-monitor-*.zip
          test "$(unzip -Z1 artifacts/ai-chat-monitor-*.zip | grep -c '^manifest.json$')" -eq 1
          test "$(unzip -Z1 artifacts/ai-chat-monitor-*.zip | grep -Ec '\.(ts|map)$|(^|/)\.env($|\.)')" -eq 0
          node -e 'const fs = require("node:fs"); const info = JSON.parse(fs.readFileSync("artifacts/build-info.json", "utf8")); if (info.sourceSha !== process.env.VALIDATION_SHA) { console.error(`build-info sourceSha mismatch: ${info.sourceSha} != ${process.env.VALIDATION_SHA}`); process.exit(1); }'
          test "$(node -p 'require("./package.json").name')" = "ai-chat-monitor"
          grep -R -q "AI_CHAT_MONITOR_STATUS=" dist
          if grep -R -I -E "Chat Turn Guardian|chat-turn-guardian|CHAT_TURN_GUARDIAN_STATUS" dist; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ai-chat-monitor-${{ env.VALIDATION_SHA }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
